[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merp-relay"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["merp_relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
