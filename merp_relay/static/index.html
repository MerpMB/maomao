<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merp Relay Ops</title>
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --line: #e3e2de; --ink: #1d1d1b; --ink-2: #55544f; --muted: #85837c;
  --track: #e9e8e4; --fill: #55544f; --accent: #2a5bd7;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --add-bg: #e7f5e7; --del-bg: #fbeaea;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --surface: #1a1a19; --line: #2e2d2a; --ink: #ecebe6; --ink-2: #b4b2aa; --muted: #8a887f;
  --track: #2e2d2a; --fill: #b4b2aa; --accent: #7aa2ff; --add-bg: #15301a; --del-bg: #3a1a1a; } }
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1a1a19; --line: #2e2d2a; --ink: #ecebe6; --ink-2: #b4b2aa; --muted: #8a887f;
  --track: #2e2d2a; --fill: #b4b2aa; --accent: #7aa2ff; --add-bg: #15301a; --del-bg: #3a1a1a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--surface); position: sticky; top: 0; z-index: 1; }
header h1 { font-size: 15px; letter-spacing: .04em; margin: 0; }
header .sp { flex: 1; }
.conn { color: var(--ink-2); font-size: 13px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.bad { background: var(--critical); }
main { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 16px; padding: 16px 20px; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; overflow-x: auto; }
section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 10px; }
#pools { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.pool h3 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.meta { color: var(--muted); font-size: 12px; }
.meter { margin: 10px 0 0; }
.meter .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.meter .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.track > i { display: block; height: 100%; border-radius: 4px; background: var(--fill); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink);
  padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sc, var(--muted)); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--bg); }
tbody tr[aria-selected="true"] { background: var(--bg); box-shadow: inset 3px 0 var(--accent); }
td.obj { max-width: 0; width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }
td.mono { white-space: nowrap; }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }
#detail .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin-bottom: 12px; }
#detail .kv dt { color: var(--muted); } #detail .kv dd { margin: 0; overflow-wrap: anywhere; }
#detail h4 { margin: 14px 0 6px; font-size: 13px; }
ul.findings { margin: 0; padding-left: 18px; } ul.findings li { margin-bottom: 4px; }
.prov { font-size: 11px; color: var(--muted); margin-left: 6px; }
pre.diff { margin: 0; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 6px;
  font: 12.5px/1.5 var(--mono); padding: 8px 0; }
pre.diff span { display: block; padding: 0 10px; white-space: pre; }
pre.diff .add { background: var(--add-bg); } pre.diff .del { background: var(--del-bg); } pre.diff .hunk { color: var(--accent); }
ol.events { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; font-size: 12.5px; }
ol.events li { display: grid; grid-template-columns: 70px 110px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
#feed { grid-column: 1 / -1; }
button.theme { background: none; border: 1px solid var(--line); color: var(--ink-2); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
@media (max-width: 640px) { header { flex-wrap: wrap; padding: 10px 16px; gap: 8px; } header .meta, #clock { display: none; }
  th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; } .meter .row { flex-direction: column; } }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; padding: 12px 16px; } td.obj { width: auto; max-width: 40vw; } }
</style>
</head>
<body>
<header>
  <h1>MERP RELAY · OPS</h1>
  <span class="conn" id="conn"><span class="dot"></span>connecting…</span>
  <span class="sp"></span>
  <span class="meta">read-only · approve/cancel via <code>python -m merp_relay.ops</code></span>
  <span class="conn mono" id="clock"></span>
  <button class="theme" id="theme" type="button" aria-label="Toggle color theme">Theme</button>
</header>
<main>
  <div id="pools" aria-live="polite"></div>
  <section aria-labelledby="runs-h"><h2 id="runs-h">Runs</h2>
    <table><thead><tr><th>Status</th><th>Run</th><th>Kind</th><th>Worker</th><th>Objective</th><th>Age</th></tr></thead>
    <tbody id="runs"></tbody></table>
    <div class="empty" id="runs-empty" hidden>No runs yet. Submit one with <code>python -m merp_relay.ops submit</code>.</div>
  </section>
  <section id="detail" aria-labelledby="detail-h"><h2 id="detail-h">Run detail</h2>
    <div class="empty">Select a run.</div></section>
  <section id="feed" aria-labelledby="feed-h"><h2 id="feed-h">Event feed</h2><ol class="events" id="events"></ol></section>
</main>
<script src="/app.js"></script>
</body>
</html>
